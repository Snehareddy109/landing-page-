<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #3e21a7;
            color: #333;
            text-align: center;
        }
        .header {
            background-color: #c42222;
            padding: 20px;
            color: white;
            font-size: 24px;
        }
        .hero {
            padding: 50px;
            background-color: #e3f2fd;
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 50px;
        }
        .feature-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 250px;
        }
        .footer {
            background-color: #333;
            color: white;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">My Landing Page</div>
    <div class="hero">
        <h1>Welcome to Our Website</h1>
        <p>Your success starts here. Join us today!</p>
    </div>
    <div class="features">
        <div class="feature-box">Feature 1</div>
        <div class="feature-box">Feature 2</div>
        <div class="feature-box">Feature 3</div>
    </div>
    <div class="footer">&copy; 2025 My Landing Page. All rights reserved.</div>
</body>
</html>
